name: Publish scholar-workflow-pdfx to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Verify GitHub Release tag against package version
        run: >-
          uv run --no-project python scripts/check_release_tag.py
          "${{ github.event.release.tag_name }}"
      - name: Run repository tests
        run: uv run --with pytest,pymupdf pytest -q lib/pdfx .apm/skills/formula-repair/tests .apm/skills/llm-ocr-refresh/tests test
      - name: Stage release package
        run: uv run --no-project python scripts/stage_release_package.py "$RUNNER_TEMP/scholar-workflow-pdfx-stage"
      - name: Build release artifacts
        run: |
          rm -rf "$RUNNER_TEMP/scholar-workflow-pdfx-dist"
          uv build "$RUNNER_TEMP/scholar-workflow-pdfx-stage" \
            --out-dir "$RUNNER_TEMP/scholar-workflow-pdfx-dist"
      - name: Verify built wheel outside checkout
        run: |
          wheel_env="$RUNNER_TEMP/scholar-workflow-pdfx-wheel-env"
          uv venv "$wheel_env"
          wheels=("$RUNNER_TEMP"/scholar-workflow-pdfx-dist/scholar_workflow_pdfx-*.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          uv pip install --python "$wheel_env/bin/python" "${wheels[0]}"
          mkdir -p "$RUNNER_TEMP/scholar-workflow-pdfx-wheel-check"
          cd "$RUNNER_TEMP/scholar-workflow-pdfx-wheel-check"
          unset PYTHONPATH
          export PATH="$wheel_env/bin:$PATH"
          "$wheel_env/bin/python" "$GITHUB_WORKSPACE/scripts/check_release_install.py" \
            --repository-root "$GITHUB_WORKSPACE"
      - name: Verify built sdist outside checkout
        run: |
          sdist_env="$RUNNER_TEMP/scholar-workflow-pdfx-sdist-env"
          uv venv "$sdist_env"
          sdists=("$RUNNER_TEMP"/scholar-workflow-pdfx-dist/scholar_workflow_pdfx-*.tar.gz)
          test "${#sdists[@]}" -eq 1
          test -f "${sdists[0]}"
          uv pip install --python "$sdist_env/bin/python" "${sdists[0]}"
          mkdir -p "$RUNNER_TEMP/scholar-workflow-pdfx-sdist-check"
          cd "$RUNNER_TEMP/scholar-workflow-pdfx-sdist-check"
          unset PYTHONPATH
          export PATH="$sdist_env/bin:$PATH"
          "$sdist_env/bin/python" "$GITHUB_WORKSPACE/scripts/check_release_install.py" \
            --repository-root "$GITHUB_WORKSPACE"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scholar-workflow-pdfx-dist
          path: ${{ runner.temp }}/scholar-workflow-pdfx-dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: scholar-workflow-pdfx-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
